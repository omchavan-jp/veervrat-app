packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  'source-map-js@>=1 <1.2.2': 1.2.2
  'proxy-addr@>=2 <2.0.8': 2.0.8
  'fast-uri@>=3 <3.1.8': 3.1.8
  'engine.io@>=6 <6.6.10': 6.6.10
  'baseline-browser-mapping@>=2 <2.11.0': 2.11.0
  'qs@>=6 <6.16.0': 6.16.0
  'socket.io-parser@>=4 <4.2.7': 4.2.7
  'body-parser@>=2 <2.3.0': 2.3.0
  'ws@>=8 <8.21.0': 8.21.0
  'undici@>=7 <7.29.1': 7.29.1
  'prosemirror-view@<1.42.3': 1.42.3
  'browserslist@>=4 <4.28.7': 4.28.7
  'mysql2@>=3 <3.23.1': 3.23.1
  'deepmerge-ts@>=7 <8': 8.0.0
  'nanoid@>=3 <3.3.18': 3.3.18
  'postcss@>=8 <8.5.23': 8.5.29
allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: true
  '@nestjs/core': true
  '@prisma/engines': true
  prisma: true
  bcrypt: true
  '@parcel/watcher': true
  '@swc/core': true
  # Its postinstall only fetches Sentry's own sentry-cli binary for local source-map upload —
  # verified by reading scripts/install.js before deciding. Not run: nothing here invokes the
  # CLI (no source-map upload step exists yet), so there's no reason to execute even a trusted
  # binary-fetch script for a feature that isn't wired up.
  '@sentry/cli': false
  # Pulled in by bullmq (#141). Its install script is `node-gyp-build-optional-packages`, which
  # downloads a prebuilt binary if one matches this platform and otherwise compiles with node-gyp.
  # It is an OPTIONAL native accelerator: msgpackr encodes and decodes perfectly well in pure JS
  # without it, and this queue moves a handful of emails a day.
  #
  # Declined because the cost is real and the benefit is not: the compile would run in CI and
  # inside the Docker build, on a base image carrying no toolchain — so the likely outcome is a
  # slower build or a broken one, in exchange for speeding up an encoding step nothing waits on.
  msgpackr-extract: false
