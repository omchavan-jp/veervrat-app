name: Verify scoped Azure identity
description: Read-only candidate login, permission and Terraform plan probes; never deploys
inputs:
  context:
    description: build, uat or prod; supplied literally by the protected CD job
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        client-id: ${{ vars.AZURE_CANDIDATE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Verify allowed reads and explicit denials
      shell: bash
      env:
        EXPECTED_CLIENT_ID: ${{ vars.AZURE_CANDIDATE_CLIENT_ID }}
        EXPECTED_PRINCIPAL_ID: ${{ vars.AZURE_CANDIDATE_PRINCIPAL_ID }}
        EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      run: node .github/scripts/verify-azure-identity.mjs '${{ inputs.context }}'
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      if: inputs.context != 'build'
      with:
        terraform_version: 1.15.8
        terraform_wrapper: false
    - name: Read-only deployment plan under candidate permissions
      if: inputs.context != 'build'
      shell: bash
      working-directory: infra/terraform/envs/${{ inputs.context }}
      env:
        CONTEXT: ${{ inputs.context }}
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      run: |
        set -euo pipefail
        umask 077
        terraform init -input=false -lockfile=readonly
        API_IMAGE=$(az containerapp show -n "veervrat-$CONTEXT-api" -g "veervrat-$CONTEXT" --query 'properties.template.containers[0].image' -o tsv)
        WEB_IMAGE=$(az containerapp show -n "veervrat-$CONTEXT-web" -g "veervrat-$CONTEXT" --query 'properties.template.containers[0].image' -o tsv)
        JOB_IMAGE=$(az containerapp job show -n "veervrat-$CONTEXT-migrate" -g "veervrat-$CONTEXT" --query 'properties.template.containers[0].image' -o tsv)
        BACKUP_IMAGE=$(az containerapp job show -n "veervrat-$CONTEXT-backup" -g "veervrat-$CONTEXT" --query 'properties.template.containers[0].image' -o tsv)
        for entry in API WEB JOB; do
          case "$entry" in
            API) image="$API_IMAGE"; repository=veervrat-api ;;
            WEB) image="$WEB_IMAGE"; repository=veervrat-web ;;
            JOB) image="$JOB_IMAGE"; repository=veervrat-api-migrate ;;
          esac
          [[ "$image" == "veervratacr.azurecr.io/$repository:"* ]] || { echo 'Unexpected deployed image repository'; exit 1; }
          [[ "${image##*:}" =~ ^[a-f0-9]{7,40}$ ]] || { echo 'Unexpected deployed image tag'; exit 1; }
        done
        [[ "$BACKUP_IMAGE" == "veervratacr.azurecr.io/veervrat-backup:${JOB_IMAGE##*:}" ]] || { echo 'Mixed migration/backup tags require a separately reviewed plan'; exit 1; }
        set +e
        terraform plan -input=false -lock-timeout=30s -no-color -detailed-exitcode \
          -var="image_tag=${JOB_IMAGE##*:}" -var="app_image_tag=${API_IMAGE##*:}" \
          -var="web_image_tag=${WEB_IMAGE##*:}" -var=deploy_apps=true \
          -out="$RUNNER_TEMP/candidate-plan.tfplan" > "$RUNNER_TEMP/candidate-plan.log" 2>&1
        result=$?
        set -e
        if [[ "$result" != 0 && "$result" != 2 ]]; then
          echo 'Candidate read-only Terraform plan failed; private plan/log contents are not published.'
          exit 1
        fi
        terraform show -json "$RUNNER_TEMP/candidate-plan.tfplan" | node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { assertPlanChanges } from "../../../../.github/scripts/verify-azure-identity.mjs";
          const plan = JSON.parse(readFileSync(0, "utf8"));
          const changes = assertPlanChanges(process.env.CONTEXT, plan.resource_changes ?? []);
          console.log(JSON.stringify({ context: process.env.CONTEXT, allowedBaselineChanges: changes }));
        '
        # Never upload plan/log/state artifacts or run terraform apply from this action.
