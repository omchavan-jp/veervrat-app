name: Deploy environment
description: >
  Applies infrastructure, runs migrations, then deploys the apps — in that order, which is
  the whole point. Shared by UAT and prod so the two cannot drift apart.

inputs:
  environment:
    description: uat or prod
    required: true
  image_tag:
    description: Git SHA of the images to deploy. Promoted, never rebuilt.
    required: true

runs:
  using: composite
  steps:
    # Container Apps resolves the *tag*, not the build job. Deploying a tag that is not in the
    # registry fails the revision with MANIFEST_UNKNOWN and leaves an app in Failed state that
    # then blocks the retry with "resource already exists".
    #
    # The auth check is separate on purpose. An earlier version collapsed "query failed" into
    # "tag not found", so an expired Azure token reported a missing image that was actually
    # present — the guard lied about why it failed, which is worse than not having one.
    - name: Verify images exist
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        set -euo pipefail
        for repo in veervrat-api veervrat-api-migrate veervrat-web; do
          if ! TAGS=$(az acr repository show-tags --name veervratacr --repository "$repo" -o tsv 2>&1); then
            echo "::error::could not query $repo — this is an ACCESS/auth failure, not a missing image"
            echo "$TAGS"
            exit 1
          fi
          if ! grep -qx "$IMAGE_TAG" <<<"$TAGS"; then
            echo "::error::$repo:$IMAGE_TAG is genuinely absent from the registry"
            echo "available tags: $(tr '\n' ' ' <<<"$TAGS")"
            exit 1
          fi
          echo "ok: $repo:$IMAGE_TAG"
        done

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.15.8
        terraform_wrapper: false

    - name: Terraform init
      shell: bash
      working-directory: infra/terraform/envs/${{ inputs.environment }}
      run: terraform init -input=false

    # What image are the apps serving RIGHT NOW? Step 1 pins them to it so they keep serving
    # while migrations run. Empty on a first deploy, in which case they simply come up on the
    # new image after migrations.
    #
    # An earlier version used `deploy_apps=false` here, reasoning that it would "leave the apps
    # untouched". It did the opposite: the flag gates the app resources, so Terraform DESTROYED
    # the running apps — and the migration job with them, which the next step then could not
    # find. Against prod that would have been a full outage on every single deploy.
    - name: Read currently-deployed image tag
      id: current
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -uo pipefail
        TAG=$(az containerapp show -n "veervrat-$ENVIRONMENT-api" -g "veervrat-$ENVIRONMENT" \
          --query "properties.template.containers[0].image" -o tsv 2>/dev/null | sed 's/.*://' || true)
        echo "currently serving: ${TAG:-<none — first deploy>}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    # Step 1 — everything EXCEPT moving the apps to the new image. The jobs (migrate, seed) are
    # updated to the new tag; the apps stay pinned to whatever they are already serving, so
    # nothing user-visible changes and nothing is torn down.
    - name: Apply infrastructure (apps stay on the current image)
      shell: bash
      working-directory: infra/terraform/envs/${{ inputs.environment }}
      run: |
        terraform apply -input=false -auto-approve \
          -var="image_tag=${{ inputs.image_tag }}" \
          -var="app_image_tag=${{ steps.current.outputs.tag }}" \
          -var="deploy_apps=true"

    # Step 2 — migrate, on the NEW image, before any app runs the new code.
    #
    # `--image` overrides the job's image for this execution only. That is what makes the
    # ordering enforceable without a second apply or a `-target` hack: the migration runs on
    # the new build while the apps are still on the old one.
    #
    # Reversed, the app boots and queries columns that do not exist yet.
    - name: Run migrations
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        set -euo pipefail
        EXEC=$(az containerapp job start \
          -n "veervrat-$ENVIRONMENT-migrate" -g "veervrat-$ENVIRONMENT" \
          --image "veervratacr.azurecr.io/veervrat-api-migrate:$IMAGE_TAG" \
          --query name -o tsv)
        echo "migration execution: $EXEC"

        # Poll to a terminal state. A migration that fails must fail the deploy — otherwise
        # the next step ships code expecting a schema that was never applied.
        for _ in $(seq 1 90); do
          STATUS=$(az containerapp job execution show \
            -n "veervrat-$ENVIRONMENT-migrate" -g "veervrat-$ENVIRONMENT" \
            --job-execution-name "$EXEC" --query properties.status -o tsv 2>/dev/null || echo Unknown)
          case "$STATUS" in
            Succeeded) echo "migrations applied"; exit 0 ;;
            Failed|Degraded)
              echo "::error::migration $EXEC failed"
              az containerapp job logs show -n "veervrat-$ENVIRONMENT-migrate" \
                -g "veervrat-$ENVIRONMENT" --container migrate --tail 60 || true
              # Prisma records a failed migration and blocks every later one until a human
              # decides whether it rolled back. Recovery is deliberate, never automatic:
              #   terraform apply -var='migrate_command=migrate resolve --rolled-back <name>'
              echo "::error::resolve it before retrying — see DEPLOYMENT.md → migrations"
              exit 1 ;;
          esac
          sleep 10
        done
        echo "::error::migration did not reach a terminal state in 15 minutes"; exit 1

    # Step 3 — now the apps move to the new image, against a schema that already matches.
    # Container Apps rolls this: a new revision starts and passes its readiness probe before
    # traffic shifts, so the old one keeps serving until the new one is genuinely up.
    - name: Deploy apps
      shell: bash
      working-directory: infra/terraform/envs/${{ inputs.environment }}
      run: |
        terraform apply -input=false -auto-approve \
          -var="image_tag=${{ inputs.image_tag }}" \
          -var="deploy_apps=true"

    # `/ready` pings Postgres and Redis, so a green here proves images, Key Vault secrets via
    # managed identity, networking and schema are all correct together. `/health` would only
    # prove the process started.
    - name: Verify /ready
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        FQDN=$(az containerapp show -n "veervrat-$ENVIRONMENT-api" -g "veervrat-$ENVIRONMENT" \
          --query properties.configuration.ingress.fqdn -o tsv)
        # Retry: min_replicas=0 means the first request after idle pays a cold start.
        for i in $(seq 1 20); do
          CODE=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 60 "https://$FQDN/ready" || echo 000)
          if [ "$CODE" = "200" ]; then cat /tmp/ready.json; echo; echo "ready"; exit 0; fi
          echo "attempt $i: HTTP $CODE"; sleep 15
        done
        echo "::error::api never became ready"; cat /tmp/ready.json 2>/dev/null || true; exit 1

    # The check whose absence let prod run for a day pointed at UAT's database.
    #
    # Every existing check passed throughout: both /ready endpoints were green, and Terraform
    # and `az containerapp show` both reported the correct api origin. All true, and the system
    # was still wrong, because nothing asked the deployed WEB tier which api it actually tells
    # browsers to call. Per-service health cannot answer a cross-tier question, and stored
    # configuration is not evidence that the running artifact honours it.
    #
    # The probe is the served HTML: the web tier renders its runtime config into the page, so
    # the api base URL in that markup is literally what a browser will use. That is a stronger
    # assertion than reading any env var back.
    #
    # (The first version of this check probed /api/v1/auth/google on the web origin, which was
    # the pre-existing proxy path. This change deletes that proxy, so the probe 404'd and the
    # check failed on its very first run — testing an architecture that no longer exists.)
    - name: Verify the web tier points at THIS environment's api
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail

        WEB=$(az containerapp show -n "veervrat-$ENVIRONMENT-web" -g "veervrat-$ENVIRONMENT" \
          --query properties.configuration.ingress.fqdn -o tsv)

        # The api hostname this environment should be using: its bound custom domain if it has
        # one, else the platform FQDN. Read from Azure rather than hardcoded so the check keeps
        # working when hostnames change.
        EXPECTED_API_HOST=$(az containerapp show -n "veervrat-$ENVIRONMENT-api" -g "veervrat-$ENVIRONMENT" \
          --query "properties.configuration.ingress.customDomains[0].name" -o tsv 2>/dev/null || true)
        if [ -z "$EXPECTED_API_HOST" ] || [ "$EXPECTED_API_HOST" = "null" ]; then
          EXPECTED_API_HOST=$(az containerapp show -n "veervrat-$ENVIRONMENT-api" -g "veervrat-$ENVIRONMENT" \
            --query properties.configuration.ingress.fqdn -o tsv)
        fi
        echo "expecting the web tier to advertise: $EXPECTED_API_HOST"

        BODY=""
        for i in $(seq 1 10); do
          BODY=$(curl -s --max-time 60 "https://$WEB/login" || echo "")
          [ -n "$BODY" ] && break
          echo "attempt $i: no response yet (cold start?)"; sleep 15
        done

        if [ -z "$BODY" ]; then
          echo "::error::could not fetch a page from the web tier to check wiring"
          exit 1
        fi

        # Positive assertion against the exact expected host. A negative test ("the other
        # environment must be absent") is unreliable because the hostnames nest:
        # api.uat.veervrat.jnanaprabodhini.org contains veervrat.jnanaprabodhini.org, so
        # "prod must not appear" would flag a perfectly healthy UAT.
        if ! printf '%s' "$BODY" | grep -qF "$EXPECTED_API_HOST"; then
          echo "::error::$ENVIRONMENT's web tier does NOT advertise $ENVIRONMENT's api."
          echo "::error::Expected $EXPECTED_API_HOST in the served HTML and it was absent."
          echo "::error::See documentation/21_Infrastructure-Conventions.md §17."
          exit 1
        fi

        echo "wiring ok — $ENVIRONMENT web advertises $EXPECTED_API_HOST"
