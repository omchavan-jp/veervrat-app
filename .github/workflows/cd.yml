# Continuous deployment.
#
# Encodes the release rules from CLAUDE.md so they cannot be got wrong by hand:
#   merge to main      -> build images tagged with the SHA -> migrate -> deploy UAT
#   tag prod-YYYY-MM-DD -> manual approval -> migrate -> deploy prod with the SAME image
#
# Every step here exists because doing it manually went wrong at least once. See
# documentation/21_Infrastructure-Conventions.md §14 and the traps table in
# ../../azure-account-facts.md §5.
name: CD

on:
  push:
    branches: [main]
    tags: ['prod-*']
  workflow_dispatch:

# Never run two deploys at the same ref concurrently, and never cancel one midway — a
# half-applied Terraform run or a partially-applied migration is worse than a slow queue.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # required to request the GitHub OIDC token Azure exchanges
  contents: read

env:
  REGISTRY: veervratacr
  REGISTRY_SERVER: veervratacr.azurecr.io

jobs:
  # ── Build once. Everything downstream promotes THIS artifact; nothing rebuilds. ──
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # One checkout, one SHA, all three images — the invariant that was broken by hand when
      # committing between builds produced three images on three different tags.
      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az acr build` builds in Azure, not on the runner. Not a convenience: Container Apps
      # runs amd64, and building elsewhere risks an architecture mismatch that surfaces as an
      # image that simply refuses to start.
      - name: Build api image
        run: |
          az acr build --registry "$REGISTRY" \
            --image "veervrat-api:${{ steps.meta.outputs.sha }}" \
            --file apps/api/Dockerfile .

      # The build stage, which keeps the `prisma` CLI and `ts-node`. Both are devDependencies
      # and are pruned out of the runtime image, so the runtime image carries the migration
      # files but cannot apply them.
      - name: Build migration image
        run: |
          az acr build --registry "$REGISTRY" \
            --image "veervrat-api-migrate:${{ steps.meta.outputs.sha }}" \
            --target build --file apps/api/Dockerfile .

      # NEXT_PUBLIC_* is inlined into the browser bundle at build time, so these must be build
      # args. They are only honoured because the Dockerfile declares matching ARG+ENV — pass an
      # undeclared one and Docker drops it silently, with no warning and a stale fallback.
      - name: Build web image
        run: |
          DOMAIN=$(az containerapp env show -n veervrat-uat-cae -g veervrat-uat \
            --query "properties.defaultDomain" -o tsv)
          az acr build --registry "$REGISTRY" \
            --image "veervrat-web:${{ steps.meta.outputs.sha }}" \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            --build-arg API_ORIGIN="https://veervrat-uat-api.$DOMAIN" \
            --build-arg NEXT_PUBLIC_SITE_URL="https://veervrat-uat-web.$DOMAIN" \
            --build-arg NEXT_PUBLIC_FEEDBACK_MODE=test \
            --build-arg NEXT_PUBLIC_COMMIT_SHA="${{ steps.meta.outputs.sha }}" \
            .

      # Container Apps resolves the tag, not the build task. A build that has "finished"
      # locally is not the same as a tag that exists — deploying too early fails the revision
      # with MANIFEST_UNKNOWN and leaves an orphaned app that blocks the retry.
      - name: Verify all three tags exist
        run: |
          for repo in veervrat-api veervrat-api-migrate veervrat-web; do
            az acr repository show-tags --name "$REGISTRY" --repository "$repo" -o tsv \
              | grep -qx "${{ steps.meta.outputs.sha }}" \
              || { echo "::error::$repo:${{ steps.meta.outputs.sha }} not found"; exit 1; }
            echo "ok: $repo:${{ steps.meta.outputs.sha }}"
          done

  deploy-uat:
    needs: build
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/deploy-environment
        with:
          environment: uat
          image_tag: ${{ needs.build.outputs.image_tag }}

  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    # ⚠️ The gate here is the TAG, not a reviewer prompt. GitHub's "required reviewers"
    # protection rule needs a paid plan on private repos (422: "billing plan supports the
    # required reviewers protection rule"), so this environment carries no protection rule.
    #
    # That is acceptable rather than ideal: cutting and pushing a `prod-YYYY-MM-DD` tag is
    # already a deliberate, explicit, traceable act — nobody pushes one by accident — and a
    # self-approval prompt would be a rubber stamp for a single maintainer anyway. The
    # environment still scopes the OIDC federated credential subject.
    #
    # Revisit if a second maintainer joins, or if the repo moves to an org on a paid plan:
    # a second pair of eyes on a production deploy is worth real money at that point.
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/deploy-environment
        with:
          environment: prod
          image_tag: ${{ needs.build.outputs.image_tag }}
