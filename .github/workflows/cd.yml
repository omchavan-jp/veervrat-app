# Continuous deployment.
#
# Encodes the release rules from AGENTS.md so they cannot be got wrong by hand:
#   merge to main       -> build images tagged with the SHA -> migrate -> deploy UAT
#   tag prod-YYYY-MM-DD -> migrate -> deploy prod with the SAME image (never rebuilt)
#
# Every step exists because doing it manually went wrong at least once. See
# documentation/21_Infrastructure-Conventions.md §14 and the traps table in
# ../../azure-account-facts.md §5.
#
# A push to main only builds+deploys if it touched an app-relevant path (see the `changes`
# step in `prepare`, and §16 of 21_Infrastructure-Conventions.md). A doc-only merge — this
# comment included — used to still rebuild all 3 images and redeploy UAT for nothing.
# prod-* tag pushes are never filtered: they're already a deliberate, rare, manual act.
name: CD

on:
  push:
    branches: [main]
    tags: ['prod-*']
  workflow_dispatch:

# Never run two deploys at the same ref concurrently, and never cancel one midway — a
# half-applied Terraform run or a partially-applied migration is worse than a slow queue.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # required to request the GitHub OIDC token Azure exchanges
  contents: read

env:
  REGISTRY: veervratacr
  REGISTRY_SERVER: veervratacr.azurecr.io

jobs:
  # Cheap job whose only purpose is to resolve values every later job needs, so each of those
  # jobs can start with a *fresh* Azure login. Azure's OIDC assertion is valid for only ~5
  # minutes; a single long job outlives its own credentials mid-run (AADSTS700024).
  prepare:
    runs-on: ubuntu-latest
    # Declared so the OIDC subject is `environment:build` regardless of whether this run was
    # triggered by a branch push or a tag. Without it the subject differs between the two and
    # tag-triggered (production) runs fail at the first job. Gates nothing.
    environment: build
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
      uat_domain: ${{ steps.meta.outputs.domain }}
      app_changed: ${{ steps.changes.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default single-commit shallow clone — `changes` below diffs
          # against the pre-push SHA, which a depth-1 checkout wouldn't have locally.
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: meta
        run: |
          set -euo pipefail
          # One checkout, one SHA, every image — the invariant broken by hand when committing
          # between builds produced three images on three different tags.
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Still resolved because the post-deploy wiring check compares against it; the web
          # image no longer needs it, since per-environment URLs are runtime config now.
          echo "domain=$(az containerapp env show -n veervrat-uat-cae -g veervrat-uat \
            --query properties.defaultDomain -o tsv)" >> "$GITHUB_OUTPUT"
      # Only meaningful for branch pushes to main — tag pushes always build (see `build`'s
      # `if`), and a manual workflow_dispatch has no `before` SHA to diff against. Anything
      # NOT matching the ignore list below counts as app-relevant, deliberately conservative:
      # an unrecognised new top-level path triggers a build rather than silently skipping one.
      - id: changes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          # `grep -qv` was tried first and dropped: piped through `-q`, it exits as soon as it
          # has enough input to decide, and on this input size that raced with a still-writing
          # producer and returned the wrong status intermittently. Capturing full output first
          # and checking it for content is slower by nothing that matters here, and correct.
          non_ignored="$(echo "$changed" | grep -vE '^(documentation/|ops/|openspec/|spec/|\.claude/)|\.md$' || true)"
          if [ -n "$non_ignored" ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # One job per image, in parallel. Three benefits over the previous single sequential job:
  # each gets its own fresh Azure login (see above), wall-clock is the slowest image rather
  # than the sum, and a failure names the image that broke.
  build:
    needs: prepare
    # Tag pushes always build (never filtered — see the top-of-file comment). Branch pushes
    # to main build only when `prepare` found an app-relevant path changed; an empty/unset
    # output (tag push, workflow_dispatch) is treated as "build" — `!= 'false'`, not `== 'true'`.
    if: startsWith(github.ref, 'refs/tags/prod-') || needs.prepare.outputs.app_changed != 'false'
    runs-on: ubuntu-latest
    environment: build # same reason as `prepare` — a stable OIDC subject across triggers
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: veervrat-api
            dockerfile: apps/api/Dockerfile
            target: runtime
          # Same Dockerfile, earlier stage. The build stage keeps the `prisma` CLI and
          # `ts-node` — both devDependencies, pruned out of runtime — so this is the only
          # image that can apply migrations or run the seed.
          - image: veervrat-api-migrate
            dockerfile: apps/api/Dockerfile
            target: build
          - image: veervrat-web
            dockerfile: apps/web/Dockerfile
            target: runtime
          # Its own image, not a stage of the api's. `pg_dump` must be at least the server's
          # major version or it refuses outright, and basing on the official postgres image gets
          # that by construction. Keeping it separate also leaves `veervrat-api-migrate` alone —
          # that one is on the critical deploy path, and a once-a-day backup is no reason to risk
          # it. See apps/backup/Dockerfile.
          - image: veervrat-backup
            dockerfile: apps/backup/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Exchanges the (short-lived) Azure token for a registry login. AcrPush comes from the
      # federated identity — there is no registry admin password; `admin_enabled = false`.
      - name: Log in to ACR
        run: az acr login --name "$REGISTRY"

      - uses: docker/setup-buildx-action@v3

      # Build args only matter for web, and only because the Dockerfile declares matching
      # ARG+ENV for each. Pass an undeclared build arg and Docker drops it silently — no
      # warning, no failure, just a stale fallback in the shipped bundle.
      # ⚠️ Only values that describe the IMAGE may go here. This image is promoted to prod
      # unchanged, so an environment-specific build arg ships UAT's value to production —
      # which is exactly how prod's web tier ended up calling UAT's api
      # (documentation/21_Infrastructure-Conventions.md §17). API_ORIGIN,
      # NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL and NEXT_PUBLIC_FEEDBACK_MODE were removed
      # from here for that reason; they are runtime env vars on the Container App now.
      - name: Resolve build args
        id: args
        run: |
          if [ "${{ matrix.image }}" = "veervrat-web" ]; then
            {
              echo 'value<<EOF'
              echo 'NEXT_PUBLIC_COMMIT_SHA=${{ needs.prepare.outputs.image_tag }}'
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo 'value=' >> "$GITHUB_OUTPUT"
          fi

      # Built on the runner rather than via `az acr build`, deliberately. `az acr build`
      # exposes no cache controls at all (no --cache-from, no --no-cache), so every run redid
      # pnpm install + prisma generate + tsc from scratch — measured at ~4min per image, cold
      # and warm alike. GitHub runners are already amd64, the same architecture Container Apps
      # runs, so the reason to build in Azure (arm64 dev laptops) does not apply here.
      #
      # Cache lives in GitHub Actions cache, not the registry: ACR Basic has a 10GB quota and
      # no purge policy yet (O17), so pushing cache layers there would quietly consume it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY_SERVER }}/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
            ${{ env.REGISTRY_SERVER }}/${{ matrix.image }}:latest
          build-args: ${{ steps.args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy-uat:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/deploy-environment
        with:
          environment: uat
          image_tag: ${{ needs.prepare.outputs.image_tag }}

  deploy-prod:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    # ⚠️ The gate here is the TAG, not a reviewer prompt. GitHub's "required reviewers"
    # protection rule needs a paid plan on private repos (422: "billing plan supports the
    # required reviewers protection rule"), so this environment carries no protection rule.
    #
    # Acceptable rather than ideal: cutting and pushing a `prod-YYYY-MM-DD` tag is already a
    # deliberate, traceable act — nobody pushes one by accident — and a self-approval prompt
    # is a rubber stamp for a single maintainer. The environment still scopes the OIDC
    # federated credential subject.
    #
    # Revisit with a second maintainer, or if the repo moves to an org on a paid plan.
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/deploy-environment
        with:
          environment: prod
          image_tag: ${{ needs.prepare.outputs.image_tag }}
