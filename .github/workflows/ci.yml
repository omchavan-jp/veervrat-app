name: CI

# Fast gate: lint + typecheck + unit tests + build. No external services needed.
# Runs on every push to the integration/production branches and on all PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` — the action reads `packageManager` from package.json, so the
      # pinned version cannot drift out of sync with local development.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client is a generated import; api typecheck/build/test need it.
      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests only here — integration tests (real Postgres/Redis) run in a
      # separate workflow with service containers.
      - name: Unit tests (api)
        run: pnpm --filter api test:unit

      - name: Unit tests (web)
        run: pnpm --filter web test

      - name: Build
        run: pnpm build

      - name: Check CD path classification
        run: bash .github/scripts/classify-changes.test.sh

      - name: Install pinned D2 for product design validation
        run: |
          set -euo pipefail
          D2_VERSION=v0.9.0
          mkdir -p "$RUNNER_TEMP/d2"
          curl -fsSL "https://github.com/d2lang/d2/releases/download/$D2_VERSION/d2-$D2_VERSION-linux-amd64.tar.gz" -o "$RUNNER_TEMP/d2.tar.gz"
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP/d2" --strip-components=1
          echo "$RUNNER_TEMP/d2/bin" >> "$GITHUB_PATH"

      - name: Install product design renderer dependencies
        working-directory: product-design/tooling
        run: corepack pnpm install --frozen-lockfile

      - name: Validate canonical product design
        working-directory: product-design/tooling
        run: corepack pnpm validate

      - name: Build Fumadocs renderer
        working-directory: product-design/tooling
        run: corepack pnpm build --webpack
