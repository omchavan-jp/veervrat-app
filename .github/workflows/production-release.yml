name: Production release

on:
  workflow_run:
    workflows: [CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify a receipt, prepare an existing tag, or record a rollback request
        type: choice
        default: verify-receipt
        options: [verify-receipt, release, register-rollback]
      release_tag:
        description: Existing release tag, or new tag name for a rollback request
        type: string
      uat_run_id:
        description: Successful UAT CD run (verify-receipt only)
        type: string
      uat_run_attempt:
        description: Exact successful UAT attempt (verify-receipt only)
        type: string
      rollback_tag:
        description: Previously verified production release (register-rollback only)
        type: string
      schema_compatible:
        description: Reviewed current schema compatibility with the old app
        type: boolean
        default: false
      schema_note:
        description: Concrete schema compatibility and recovery assessment; no credentials or personal data
        type: string

permissions:
  contents: read

# Serialize across all tags, including requests awaiting native approval.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && github.actor_id == '317451750' && github.triggering_actor == 'omchavan-jp') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'prod-') &&
      github.event.workflow_run.repository.id == 1287947867 && github.event.workflow_run.head_repository.id == 1287947867 &&
      github.event.workflow_run.actor.id == 317451750 && github.event.workflow_run.triggering_actor.id == 317451750))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: uat
    permissions:
      contents: write
      actions: read
      id-token: write
    outputs:
      deploy: ${{ steps.prepare.outputs.deploy }}
      manifest_digest: ${{ steps.prepare.outputs.manifest_digest }}
      release_url: ${{ steps.prepare.outputs.release_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate main controller and request provenance before cloud login
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-release.mjs guard
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify accepted evidence and publish prerequisite release manifest
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-release.mjs prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.deploy == 'true'
        with:
          name: production-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.manifest }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.deploy == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: prod
      url: ${{ needs.prepare.outputs.release_url }}
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download only this controller attempt's manifest
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "production-manifest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --dir "$RUNNER_TEMP/production-handoff"
          echo "MANIFEST_FILE=$RUNNER_TEMP/production-handoff/manifest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Revalidate manifest, native owner approval, tag and baseline
        id: begin
        run: node .github/scripts/production-release.mjs begin
      - name: Select verified infrastructure source without executing tag workflow code
        id: source
        run: node .github/scripts/production-release.mjs source
      - uses: ./.github/actions/deploy-environment
        id: deployment
        with:
          environment: prod
          image_tag: ${{ steps.source.outputs.image_tag }}
          digest_images: 'true'
          source_directory: ${{ steps.source.outputs.directory }}
          rollback: ${{ steps.source.outputs.rollback }}
      - name: Verify exact serving production digests and cross-tier health
        id: health
        run: node .github/scripts/deploy-production.mjs verify
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        if: always() && steps.begin.outputs.authorized == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Record immutable outcome and update release record
        if: always() && steps.begin.outputs.authorized == 'true'
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome == 'success' && steps.health.outcome == 'success' && 'success' || 'failure' }}
        run: node .github/scripts/production-release.mjs finish
