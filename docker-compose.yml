services:
  postgres:
    image: postgres:18-alpine
    container_name: veervrat-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: veervrat
      POSTGRES_PASSWORD: veervrat_local
      POSTGRES_DB: veervrat
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: veervrat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: veervrat-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "veervrat_meili_local"
      MEILI_ENV: "development"
    volumes:
      - meilisearch_data:/meili_data

  # MinIO community Docker image was discontinued Oct 2025, repo archived Apr 2026.
  # Using Chainguard's free, maintained, vulnerability-scanned image instead.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: veervrat-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: veervrat
      MINIO_ROOT_PASSWORD: veervrat_local
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:
