services:
  postgres:
    image: postgres:16-alpine
    container_name: veervrat-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: veervrat
      POSTGRES_PASSWORD: veervrat_local
      POSTGRES_DB: veervrat
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
